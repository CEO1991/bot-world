name: Advance world
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      jump_sim_hours:
        description: 'Fast-forward the shared world by this many simulated hours (0-168, 0 = normal tick)'
        required: false
        default: '0'
        type: string
permissions:
  contents: write
concurrency:
  group: advance-world
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Advance simulation and commit state (retries on push conflicts)
        env:
          JUMP_SIM_HOURS: ${{ github.event.inputs.jump_sim_hours || '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/advance.js || exit 1
            git add state.json
            if git diff --cached --quiet; then echo "No change"; exit 0; fi
            if [ "$JUMP_SIM_HOURS" != "0" ]; then MSG="World jump +${JUMP_SIM_HOURS}h sim"; else MSG="World tick"; fi
            git commit -m "$MSG $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt), main moved; recomputing from the newest state"
            sleep $((attempt * 5))
          done
          exit 1
